[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hatchet-mcp"
dynamic = ["version"]
description = "MCP server that runs HATCHet copy-number inference inside a container"
requires-python = ">=3.10"
license = "BSD-3-Clause"
dependencies = ["fastmcp>=4.0"]

[project.optional-dependencies]
test = ["pytest>=8", "numpy>=1.22"]

[project.scripts]
hatchet-mcp = "hatchet_mcp.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "hatchet_mcp.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hatchet_mcp = ["container/Dockerfile"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
